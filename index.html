<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Recipes">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon.png">
<title>Our Recipes</title>
<!--
  Written for iPad mini 2 / iOS 12 Safari:
  - no optional chaining, ?? , replaceAll, flex "gap", aspect-ratio, etc.
  - grid uses grid-gap; everything else uses margins
-->
<style>
  :root {
    --bg: #faf6ef;
    --card: #ffffff;
    --ink: #2b2620;
    --muted: #7a7064;
    --line: #e7dfd2;
    --accent: #b5532c;
    --accent-soft: #f6e4da;
    --done: #b9b0a4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .serif { font-family: Georgia, "Times New Roman", serif; }

  /* ---------- top bar ---------- */
  .top {
    position: -webkit-sticky; position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 14px 18px 10px;
  }
  .top-row { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
  .app-title { font-size: 28px; font-weight: bold; margin: 0; -webkit-flex: 1; flex: 1; }
  .icon-btn {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 9px 14px; font-size: 16px; margin-left: 8px;
  }
  .icon-btn:active { background: var(--accent-soft); }
  .search {
    display: block; width: 100%; margin-top: 12px;
    font-size: 18px; padding: 11px 14px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--card);
    -webkit-appearance: none; appearance: none; outline: none;
  }
  .search:focus { border-color: var(--accent); }
  .chips {
    white-space: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch;
    margin: 10px -18px 0; padding: 0 18px 2px;
  }
  .chip {
    display: inline-block; margin-right: 8px;
    border: 1px solid var(--line); background: var(--card);
    border-radius: 999px; padding: 7px 15px; font-size: 15px;
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .status { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .status.warn { color: var(--accent); }

  /* ---------- list ---------- */
  .wrap { padding: 16px 18px 40px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    grid-gap: 14px;
  }
  .card {
    display: block; text-align: left; width: 100%;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 0; overflow: hidden;
  }
  .card:active { border-color: var(--accent); }
  .card-img { display: block; width: 100%; height: 130px; object-fit: cover; background: var(--accent-soft); }
  .card-body { padding: 14px 16px 16px; }
  .card-title { font-size: 20px; font-weight: bold; line-height: 1.25; margin: 0 0 6px; }
  .card-meta { font-size: 14px; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; }

  /* ---------- recipe ---------- */
  .r-head { margin-bottom: 18px; }
  .r-title { font-size: 34px; line-height: 1.15; margin: 4px 0 10px; font-weight: bold; }
  .r-meta span {
    display: inline-block; margin: 0 8px 8px 0;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 5px 12px; font-size: 15px;
  }
  .r-meta b { font-weight: 600; }
  .r-photo { display: block; width: 100%; max-height: 320px; object-fit: cover; border-radius: 16px; margin-bottom: 18px; }
  .cols { display: block; }
  .col { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; margin-bottom: 16px; }
  .col h2 { font-size: 22px; margin: 0 0 10px; }
  .col h3 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; }
  .col h3:first-of-type { margin-top: 4px; }
  ul.ing, ol.steps { list-style: none; margin: 0; padding: 0; }
  ul.ing li {
    padding: 9px 0 9px 36px; position: relative; border-bottom: 1px solid var(--line);
  }
  ul.ing li:last-child { border-bottom: 0; }
  ul.ing li:before {
    content: ""; position: absolute; left: 2px; top: 11px;
    width: 20px; height: 20px; border: 2px solid var(--line); border-radius: 6px; background: #fff;
  }
  ul.ing li.done { color: var(--done); text-decoration: line-through; }
  ul.ing li.done:before { background: var(--accent); border-color: var(--accent); }
  ol.steps li {
    position: relative; padding: 12px 12px 12px 52px; margin: 0 -12px 6px; border-radius: 12px;
  }
  ol.steps li .n {
    position: absolute; left: 12px; top: 11px;
    width: 30px; height: 30px; border-radius: 15px; text-align: center; line-height: 30px;
    background: var(--accent-soft); color: var(--accent); font-weight: bold; font-size: 15px;
  }
  ol.steps li.cur { background: var(--accent-soft); }
  ol.steps li.cur .n { background: var(--accent); color: #fff; }
  ol.steps li.done { color: var(--done); }
  .notes { white-space: pre-wrap; }
  .source a { color: var(--accent); word-break: break-all; }
  .hint { font-size: 13px; color: var(--muted); margin: -4px 0 10px; }

  /* text size options (cooking view) */
  body.ts-1 .cols { font-size: 19px; }
  body.ts-2 .cols { font-size: 22px; }
  body.ts-3 .cols { font-size: 26px; }

  /* landscape / wide: ingredients beside steps */
  @media (min-width: 900px) {
    .cols { display: -webkit-flex; display: flex; -webkit-align-items: flex-start; align-items: flex-start; }
    .col.left { -webkit-flex: 0 0 38%; flex: 0 0 38%; margin-right: 16px;
      position: -webkit-sticky; position: sticky; top: 90px; }
    .col.right { -webkit-flex: 1; flex: 1; }
  }

  /* ---------- setup ---------- */
  .setup { max-width: 620px; margin: 30px auto; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
  .setup h2 { margin-top: 0; }
  .setup input { width: 100%; font-size: 16px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; -webkit-appearance: none; }
  .btn { display: inline-block; margin: 14px 10px 0 0; padding: 11px 18px; border-radius: 12px; border: 0; background: var(--accent); color: #fff; font-size: 16px; }
  .btn.alt { background: var(--accent-soft); color: var(--accent); }
  /* ---------- converter ---------- */
  .conv { max-width: 760px; margin: 0 auto; }
  .conv h1 { font-size: 30px; margin: 4px 0 14px; }
  .field { display: block; margin-bottom: 12px; }
  .field label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 5px; }
  .field input, .field select {
    display: block; width: 100%; font-size: 22px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink);
    -webkit-appearance: none; appearance: none; outline: none;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .field select {
    padding-right: 38px;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='9'%3E%3Cpath d='M1 1l6 6 6-6' fill='none' stroke='%23b5532c' stroke-width='2'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 14px center;
  }
  .frow { display: -webkit-flex; display: flex; }
  .frow .field { -webkit-flex: 1; flex: 1; }
  .frow .field + .field { margin-left: 12px; }
  .res-h { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 8px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); grid-gap: 10px; }
  .tile { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  .tile.from { background: var(--accent-soft); border-color: var(--accent); }
  .tile .v { font-size: 26px; font-weight: bold; line-height: 1.2; }
  .tile .u { font-size: 15px; color: var(--muted); }
  .ref { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 17px; }
  .ref td, .ref th { text-align: left; padding: 7px 4px; border-bottom: 1px solid var(--line); }
  .ref th { font-size: 14px; color: var(--muted); font-weight: normal; }
  /* ---------- select mode + shopping list ---------- */
  .top-row { -webkit-flex-wrap: wrap; flex-wrap: wrap; }
  .card { position: relative; }
  .selpad .card:after {
    content: ""; position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; border-radius: 16px;
    border: 2px solid var(--line); background: #fff; color: #fff; text-align: center; line-height: 28px; font-weight: bold;
  }
  .selpad .card.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .selpad .card.sel:after { content: "\2713"; background: var(--accent); border-color: var(--accent); }
  .wrap.selpad { padding-bottom: 110px; }
  .selbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center;
    background: var(--card); border-top: 1px solid var(--line); padding: 12px 18px;
    box-shadow: 0 -4px 16px rgba(0,0,0,.06);
  }
  .selbar span { -webkit-flex: 1; flex: 1; font-size: 18px; }
  .selbar .btn { margin: 0; }
  .btn[disabled] { opacity: .4; }
  .rchip {
    display: inline-block; margin: 0 8px 8px 0; border: 1px solid var(--line); background: var(--accent-soft);
    border-radius: 999px; padding: 7px 14px; font-size: 15px;
  }
  .rchip .x { color: var(--accent); font-weight: bold; margin-left: 4px; }
  ul.shop li { padding-right: 40px; }
  ul.shop li .src { display: block; font-size: 13px; color: var(--muted); }
  .rmx { position: absolute; right: 0; top: 4px; border: 0; background: none; font-size: 24px; color: var(--muted); padding: 2px 10px; }
  .addrow { -webkit-align-items: flex-end; align-items: flex-end; }
  .addrow .btn { margin: 0 0 12px 12px; }
  .shopv { max-width: 1000px; }
  @media (min-width: 900px) {
    .aisles { -webkit-column-count: 2; column-count: 2; -webkit-column-gap: 28px; column-gap: 28px; }
    .aisle { display: inline-block; width: 100%; -webkit-column-break-inside: avoid; break-inside: avoid; }
  }
  .hidden { display: none !important; }
</style>
</head>
<body class="ts-1">

<div class="top" id="top">
  <div class="top-row">
    <button class="icon-btn hidden" id="backBtn">&#8249; All recipes</button>
    <h1 class="app-title serif" id="appTitle">Our Recipes</h1>
    <button class="icon-btn hidden" id="sizeBtn" title="Text size">Aa</button>
    <button class="icon-btn hidden" id="selectBtn">Select</button>
    <button class="icon-btn" id="convBtn" title="Measurement converter">&#8644; Convert</button>
    <button class="icon-btn" id="shopBtn" title="Shopping list">&#128722; List</button>
    <button class="icon-btn" id="refreshBtn" title="Refresh">&#8635;</button>
  </div>
  <div id="listControls">
    <input class="search" id="search" type="search" placeholder="Search recipes or ingredients" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <div class="chips" id="chips"></div>
  </div>
  <div class="status" id="status"></div>
</div>

<div class="wrap" id="main"></div>

<div class="selbar hidden" id="selBar">
  <span id="selCount">Tap recipes to select</span>
  <button class="btn" id="selAdd" disabled>Add to shopping list</button>
</div>

<script>
/* =====================================================================
   SETUP: paste your Google Sheet's "Publish to web" CSV link below.
   (File > Share > Publish to web > choose the sheet > CSV > Publish)
   ===================================================================== */
var SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSh2KH_vcT3Io_1ZdoMO-ooKOH3qM2qYt3M2LqxU0YnIeY8xI8KsnTvAKuCScqdbQWpo2LSz2HRPi_S/pub?output=csv";
var APP_TITLE = "Our Recipes";
/* ===================================================================== */

var SAMPLE_CSV =
  'Title,Category,Servings,Prep Time,Cook Time,Ingredients,Steps,Notes,Source,Photo URL\n' +
  '"Weeknight Chicken Tacos","Dinner, Quick",4,10 min,15 min,' +
  '"1.5 lb chicken thighs\n1 tbsp chili powder\n1 tsp cumin\n1 tsp garlic powder\n1 lime\n8 small tortillas\nToppings:\nShredded cabbage\nCotija cheese\nSalsa",' +
  '"Toss chicken with chili powder, cumin, garlic powder, and a big pinch of salt.\nCook in a hot skillet 6-7 minutes per side until cooked through.\nRest 5 minutes, then slice and squeeze lime over the top.\nWarm tortillas and build tacos with toppings.",' +
  '"Works great on the grill too.",,\n' +
  '"Banana Bread","Baking, Breakfast",1 loaf,15 min,60 min,' +
  '"3 very ripe bananas\n1/3 cup melted butter\n3/4 cup sugar\n1 egg\n1 tsp vanilla\n1 tsp baking soda\nPinch of salt\n1.5 cups flour",' +
  '"Heat oven to 350F and grease a loaf pan.\nMash bananas, then stir in melted butter.\nMix in sugar, egg, and vanilla.\nSprinkle in baking soda and salt, then fold in flour until just combined.\nBake 55-65 minutes, until a toothpick comes out clean.",' +
  '"Add a handful of chocolate chips if you like.",,\n';

var store = {
  get: function (k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} },
  del: function (k) { try { window.localStorage.removeItem(k); } catch (e) {} }
};

var state = {
  recipes: [],
  bySlug: {},
  category: "All",
  query: "",
  checked: {},     // slug -> {ingredientIndex: true}
  stepCur: {},     // slug -> current step index
  textSize: parseInt(store.get("textSize") || "1", 10),
  lastUpdated: null,
  offline: false,
  error: ""
};

var $ = function (id) { return document.getElementById(id); };

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/* ---------- CSV parsing (handles quotes, commas, and line breaks in cells) ---------- */
function parseCSV(text) {
  var rows = [], row = [], field = "", inQ = false, i = 0, c;
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  while (i < text.length) {
    c = text.charAt(i);
    if (inQ) {
      if (c === '"') {
        if (text.charAt(i + 1) === '"') { field += '"'; i += 2; continue; }
        inQ = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if (c === '"') { inQ = true; i++; continue; }
    if (c === ",") { row.push(field); field = ""; i++; continue; }
    if (c === "\r") { i++; continue; }
    if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; i++; continue; }
    field += c; i++;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows;
}

var COLUMN_NAMES = {
  title: ["title", "name", "recipe", "recipename"],
  category: ["category", "categories", "type", "tags", "tag"],
  servings: ["servings", "serves", "yield", "makes"],
  prep: ["prep", "preptime"],
  cook: ["cook", "cooktime"],
  total: ["time", "totaltime"],
  ingredients: ["ingredients", "ingredient"],
  steps: ["steps", "directions", "instructions", "method"],
  notes: ["notes", "note", "tips"],
  source: ["source", "link", "url", "from"],
  photo: ["photo", "photourl", "image", "imageurl", "picture"]
};

function normHeader(h) { return String(h).toLowerCase().replace(/[^a-z0-9]/g, ""); }

function splitLines(s) {
  s = String(s || "").replace(/\r/g, "");
  var parts = s.indexOf("\n") > -1 ? s.split("\n") : s.split("|");
  var out = [];
  for (var i = 0; i < parts.length; i++) {
    var t = parts[i].replace(/^\s+|\s+$/g, "");
    if (t) out.push(t);
  }
  return out;
}

function slugify(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "recipe";
}

function rowsToRecipes(rows) {
  if (!rows.length) return [];
  var header = rows[0], map = {}, k, j, n;
  for (k in COLUMN_NAMES) {
    for (j = 0; j < header.length; j++) {
      n = normHeader(header[j]);
      if (COLUMN_NAMES[k].indexOf(n) > -1 && map[k] == null) map[k] = j;
    }
  }
  if (map.title == null) throw new Error('No "Title" column found in the sheet.');
  var get = function (r, key) { return map[key] == null ? "" : (r[map[key]] || "").replace(/^\s+|\s+$/g, ""); };
  var out = [], seen = {};
  for (var i = 1; i < rows.length; i++) {
    var r = rows[i], title = get(r, "title");
    if (!title) continue;
    var slug = slugify(title), base = slug, x = 2;
    while (seen[slug]) { slug = base + "-" + x; x++; }
    seen[slug] = true;
    var cats = get(r, "category").split(/[,;]/), catList = [];
    for (j = 0; j < cats.length; j++) { var c = cats[j].replace(/^\s+|\s+$/g, ""); if (c) catList.push(c); }
    out.push({
      slug: slug,
      title: title,
      categories: catList,
      servings: get(r, "servings"),
      prep: get(r, "prep"),
      cook: get(r, "cook"),
      total: get(r, "total"),
      ingredients: splitLines(get(r, "ingredients")),
      steps: splitLines(get(r, "steps")).map(function (s) { return s.replace(/^(step\s*)?\d+[\.\):]\s*/i, ""); }),
      notes: get(r, "notes"),
      source: get(r, "source"),
      photo: get(r, "photo")
    });
  }
  out.sort(function (a, b) { return a.title.toLowerCase() < b.title.toLowerCase() ? -1 : 1; });
  return out;
}

function loadFromCSV(text) {
  var recipes = rowsToRecipes(parseCSV(text));
  state.recipes = recipes;
  state.bySlug = {};
  for (var i = 0; i < recipes.length; i++) state.bySlug[recipes[i].slug] = recipes[i];
}

/* ---------- data loading ---------- */
function friendlyError(msg) { var e = new Error(msg); e.friendly = true; return e; }
// Accepts a "Publish to web" link in either Web page (pubhtml) or CSV form
function fixSheetUrl(u) {
  if (!u || u === "demo") return u;
  if (/\/pubhtml/.test(u)) {
    var gid = /[?&#]gid=(\d+)/.exec(u);
    u = u.replace(/\/pubhtml.*$/, "/pub?output=csv" + (gid ? "&gid=" + gid[1] + "&single=true" : ""));
  }
  return u;
}
function sheetUrl() { return fixSheetUrl(SHEET_CSV_URL || store.get("sheetUrl") || ""); }

function refresh() {
  var url = sheetUrl();
  if (url === "demo") {
    loadFromCSV(SAMPLE_CSV);
    state.lastUpdated = new Date(); state.offline = false; state.error = "";
    route(); return;
  }
  if (!url) { route(); return; }
  setStatus("Loading recipes…", false);
  var bust = (url.indexOf("?") > -1 ? "&" : "?") + "_=" + Date.now();
  fetch(url + bust, { cache: "no-store" })
    .then(function (res) {
      if (!res.ok) throw friendlyError("The recipe sheet returned an error (" + res.status + "). Make sure it's still published to the web.");
      return res.text();
    })
    .then(function (text) {
      if (/^\s*</.test(text)) throw friendlyError("That link returned a web page, not CSV. Re-check the Publish to web step and choose CSV.");
      loadFromCSV(text);
      store.set("cachedCSV", text);
      store.set("cachedAt", String(Date.now()));
      state.lastUpdated = new Date(); state.offline = false; state.error = "";
      route();
    })
    .catch(function (err) {
      var cached = store.get("cachedCSV");
      if (cached) {
        try { loadFromCSV(cached); } catch (e) {}
        state.offline = true;
        state.lastUpdated = new Date(parseInt(store.get("cachedAt") || "0", 10));
        state.error = "";
      } else {
        // Our own errors (bad status, not CSV) are specific; network failures ("Load failed") are not.
        state.error = (err && err.friendly) ? err.message :
          "Couldn't reach the recipe sheet. Check the Wi-Fi, then tap ↻. If it keeps failing, make sure the sheet is still published to the web.";
      }
      route();
    });
}

function timeAgo(d) {
  if (!d || !d.getTime()) return "";
  var m = Math.round((Date.now() - d.getTime()) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  var h = Math.round(m / 60);
  if (h < 24) return h + " hr ago";
  return d.toLocaleDateString();
}

function setStatus(text, warn) {
  var el = $("status");
  el.textContent = text;
  el.className = "status" + (warn ? " warn" : "");
}

function updateStatus() {
  if (state.error) { setStatus(state.error, true); return; }
  if (!state.lastUpdated) { setStatus("", false); return; }
  var n = state.recipes.length;
  var base = n + " recipe" + (n === 1 ? "" : "s");
  if (state.offline) setStatus(base + " · Offline, showing copy saved " + timeAgo(state.lastUpdated), true);
  else setStatus(base + " · Updated " + timeAgo(state.lastUpdated), false);
}

/* ---------- views ---------- */
function allCategories() {
  var seen = {}, list = [];
  for (var i = 0; i < state.recipes.length; i++) {
    var c = state.recipes[i].categories;
    for (var j = 0; j < c.length; j++) if (!seen[c[j].toLowerCase()]) { seen[c[j].toLowerCase()] = 1; list.push(c[j]); }
  }
  list.sort(function (a, b) { return a.toLowerCase() < b.toLowerCase() ? -1 : 1; });
  return list;
}

function matches(r) {
  if (state.category !== "All") {
    var ok = false;
    for (var i = 0; i < r.categories.length; i++) if (r.categories[i].toLowerCase() === state.category.toLowerCase()) ok = true;
    if (!ok) return false;
  }
  var q = state.query.toLowerCase().replace(/^\s+|\s+$/g, "");
  if (!q) return true;
  var hay = (r.title + " " + r.categories.join(" ") + " " + r.ingredients.join(" ")).toLowerCase();
  var words = q.split(/\s+/);
  for (var w = 0; w < words.length; w++) if (hay.indexOf(words[w]) === -1) return false;
  return true;
}

/* ---------- measurement converter ---------- */
// Volume units in ml, weight units in grams (US customary measures)
var VOL = { tsp: 4.92892, tbsp: 14.7868, cup: 236.588, floz: 29.5735, pint: 473.176, quart: 946.353, gallon: 3785.41, ml: 1, l: 1000 };
var WT = { oz: 28.3495, lb: 453.592, g: 1, kg: 1000 };
var UNIT_LABEL = { tsp: "tsp", tbsp: "tbsp", cup: "cup", floz: "fl oz", pint: "pint", quart: "quart", gallon: "gallon",
  ml: "ml", l: "liter", oz: "oz (weight)", lb: "lb", g: "grams", kg: "kg" };
var UNIT_ORDER = ["tsp", "tbsp", "cup", "floz", "pint", "quart", "gallon", "ml", "l", "oz", "lb", "g", "kg"];
// Approximate grams per US cup (standard baking averages)
var INGREDIENTS = [
  ["Water / milk / broth", 237],
  ["All-purpose or bread flour", 120],
  ["Whole wheat flour", 113],
  ["Granulated sugar", 198],
  ["Brown sugar (packed)", 213],
  ["Powdered sugar", 113],
  ["Butter", 227],
  ["Vegetable or olive oil", 198],
  ["Honey / molasses", 336],
  ["Yogurt / sour cream", 227],
  ["Rolled oats", 89],
  ["Cocoa powder", 84],
  ["Chocolate chips", 170],
  ["Table salt", 288]
];

var conv = { amount: "1", unit: "cup", ing: 0, temp: "350", tempUnit: "F", prevHash: "" };

function parseAmount(s) {
  s = String(s || "")
    .replace(/½/g, " 1/2").replace(/¼/g, " 1/4").replace(/¾/g, " 3/4")
    .replace(/⅓/g, " 1/3").replace(/⅔/g, " 2/3").replace(/⅛/g, " 1/8")
    .replace(/,/g, ".").replace(/^\s+|\s+$/g, "");
  if (!s) return NaN;
  var parts = s.split(/\s+/), total = 0;
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i], m = /^(\d+)\/(\d+)$/.exec(p);
    if (m) { if (+m[2] === 0) return NaN; total += m[1] / m[2]; }
    else if (/^\d*\.?\d+$/.test(p)) total += parseFloat(p);
    else return NaN;
  }
  return total;
}

function fmtDec(x) {
  var d = x >= 100 ? 0 : (x >= 10 ? 1 : 2);
  if (x > 0 && x < 0.01) return "<0.01";
  return String(parseFloat(x.toFixed(d)));
}

// Nice kitchen fractions (eighths or thirds) for tsp / tbsp / cup
function fmtFrac(x) {
  if (x < 0.1) return fmtDec(x);
  var best = null, dens = [8, 3, 4, 2];
  for (var i = 0; i < dens.length; i++) {
    var d = dens[i], n = Math.round(x * d), err = Math.abs(n / d - x);
    if (!best || err < best.err - 1e-9) best = { n: n, d: d, err: err };
  }
  var whole = Math.floor(best.n / best.d), rem = best.n % best.d, g = rem, h = best.d, t;
  while (h) { t = h; h = g % h; g = t; }               // reduce fraction
  var s = (whole ? whole : "") + (rem ? (whole ? " " : "") + (rem / g) + "/" + (best.d / g) : "");
  if (!s) s = "0";
  return (best.err / x > 0.03 ? "≈ " : "") + s;
}

function fmtUnit(u, x) { return (u === "tsp" || u === "tbsp" || u === "cup") ? fmtFrac(x) : fmtDec(x); }

function showUnit(u, x, from) {
  if (u === from) return true;
  if (u === "tsp") return x <= 48;
  if (u === "tbsp") return x <= 64 && x >= 0.24;
  if (u === "cup") return x >= 0.06;
  if (u === "pint" || u === "quart" || u === "gallon" || u === "l" || u === "lb" || u === "kg") return x >= 0.25;
  return true;
}

function tiles(units, base, table, from) {
  var html = "";
  for (var i = 0; i < units.length; i++) {
    var u = units[i], x = base / table[u];
    if (!showUnit(u, x, from)) continue;
    html += '<div class="tile' + (u === from ? " from" : "") + '"><div class="v">' + esc(fmtUnit(u, x)) +
      '</div><div class="u">' + esc(UNIT_LABEL[u]) + "</div></div>";
  }
  return '<div class="tiles">' + html + "</div>";
}

function convResults() {
  var amt = parseAmount(conv.amount);
  if (!(amt > 0)) return '<p class="hint">Enter an amount like 2, 1.5, 3/4, or 1 1/2.</p>';
  var u = conv.unit, gpc = INGREDIENTS[conv.ing][1], ingName = INGREDIENTS[conv.ing][0];
  var volUnits = ["tsp", "tbsp", "cup", "floz", "pint", "quart", "gallon", "ml", "l"];
  var wtUnits = ["g", "oz", "lb", "kg"];
  var html;
  if (VOL[u]) {
    var ml = amt * VOL[u];
    html = '<div class="res-h">Volume</div>' + tiles(volUnits, ml, VOL, u) +
      '<div class="res-h">Weight · approx. for ' + esc(ingName.toLowerCase()) + "</div>" +
      tiles(wtUnits, ml / VOL.cup * gpc, WT, null);
  } else {
    var g = amt * WT[u];
    html = '<div class="res-h">Weight</div>' + tiles(wtUnits, g, WT, u) +
      '<div class="res-h">Volume · approx. for ' + esc(ingName.toLowerCase()) + "</div>" +
      tiles(["tsp", "tbsp", "cup", "ml"], g / gpc * VOL.cup, VOL, null);
  }
  return html;
}

function tempResult() {
  var t = parseFloat(String(conv.temp).replace(",", "."));
  if (isNaN(t)) return '<p class="hint">Enter a temperature.</p>';
  var out = conv.tempUnit === "F" ? Math.round((t - 32) * 5 / 9) + " °C" : Math.round(t * 9 / 5 + 32) + " °F";
  return '<div class="tiles"><div class="tile from"><div class="v">' + esc(out) + '</div><div class="u">' +
    esc(t + " °" + conv.tempUnit) + "</div></div></div>";
}

  }
  var oven = [250, 300, 325, 350, 375, 400, 425, 450, 475], rows = "";
  for (i = 0; i < oven.length; i++) rows += "<tr><td>" + oven[i] + " °F</td><td>" + Math.round((oven[i] - 32) * 5 / 9) + " °C</td></tr>";

  $("main").innerHTML =

    '<h1 class="serif">Convert</h1>' +
    '<div class="col"><h2 class="serif">Amounts</h2>' +
      '<div class="frow">' +
        '<div class="field"><label for="cvAmt">Amount</label>' +
          '<input id="cvAmt" type="text" inputmode="decimal" autocomplete="off" autocorrect="off" value="' + esc(conv.amount) + '"></div>' +
        '<div class="field"><label for="cvUnit">Unit</label><select id="cvUnit">' + unitOpts + "</select></div>" +
      "</div>" +
      '<div class="field"><label for="cvIng">Ingredient (for cups ↔ grams)</label><select id="cvIng">' + ingOpts + "</select></div>" +
      '<div id="cvOut">' + convResults() + "</div>" +
      '<p class="hint" style="margin-top:12px">Weights are standard averages and vary with how you scoop. Fractions are rounded to the nearest kitchen measure (≈ means approximate).</p>' +
    "</div>" +
    '<div class="col"><h2 class="serif">Temperature</h2>' +
      '<div class="frow">' +
        '<div class="field"><label for="cvTemp">Temperature</label>' +
          '<input id="cvTemp" type="text" inputmode="decimal" autocomplete="off" value="' + esc(conv.temp) + '"></div>' +
        '<div class="field"><label for="cvTempU">From</label><select id="cvTempU">' +
          '<option value="F"' + (conv.tempUnit === "F" ? " selected" : "") + ">°F</option>" +
          '<option value="C"' + (conv.tempUnit === "C" ? " selected" : "") + ">°C</option></select></div>" +
      "</div>" +
      '<div id="cvTempOut">' + tempResult() + "</div>" +
      '<table class="ref"><tr><th>Common oven temps</th><th></th></tr>' + rows + "</table>" +
    "</div></div>";
}

var AISLES = ["Produce", "Meat & Seafood", "Dairy & Refrigerated", "Bakery", "Frozen", "Pantry"];
var AISLE_RULES = [
  [4, /\bfrozen\b/],
  [5, /sauce|paste|\bcans?\b|canned|flakes|powder|dried|seasoning|broth|stock|coconut|vinegar|glaze|cornstarch|\bseeds?\b|panko|breadcrumb/],
  [1, /chicken|beef|steak|pork|sausage|turkey|shrimp|salmon|tilapia|\bcod\b|fish|bacon|\bham\b|wings|thighs|lamb|prosciutto/],
  [2, /butter|milk|cream|cheese|mozzarella|parmesan|cheddar|ricotta|cotija|feta|yogurt|\beggs?\b|tofu|tortellini|pesto|dough/],
  [3, /\bbuns?\b|bread|tortillas?|naan|pita|\brolls?\b|bagels?/],
  [0, /garlic|onion|shallot|bell pepper|jalape|lemon|lime|tomato|basil|parsley|cilantro|ginger|broccoli|zucchini|potato|lettuce|spinach|mushroom|eggplant|cabbage|coleslaw|carrot|celery|avocado|scallion|vegetables|banana|apple|herbs|kale|cucumber|\bcorn\b/]
];
function aisleOf(name) {
  var n = name.toLowerCase();
  for (var i = 0; i < AISLE_RULES.length; i++) if (AISLE_RULES[i][1].test(n)) return AISLE_RULES[i][0];
  return 5;
}

var PREP_RE = /\b(minced|sliced|diced|chopped|grated|beaten|halved|cubed|juiced|peeled|deveined|zested|crushed|melted|softened|optional|for serving|to taste|room temperature)\b/i;
var QTY_RE = /^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?\s*[½¼¾⅓⅔⅛]?|[½¼¾⅓⅔⅛])\s+(.+)$/;
var UNIT_RE = /^(tsp|teaspoons?|tbsp|tablespoons?|cups?|oz|ounces?|lbs?|pounds?|cans?|packets?|packages?|blocks?|bunch(?:es)?|cloves?|heads?|pints?|g|kg|ml)\.?\s+(.+)$/i;
var UNIT_NORM = { teaspoon: "tsp", teaspoons: "tsp", tablespoon: "tbsp", tablespoons: "tbsp", cups: "cup", ounce: "oz", ounces: "oz",
  lbs: "lb", pound: "lb", pounds: "lb", cans: "can", packets: "packet", packages: "package", blocks: "block", bunches: "bunch",
  cloves: "clove", heads: "head", pints: "pint" };
var UNIT_PLURAL = { cup: "cups", can: "cans", packet: "packets", package: "packages", block: "blocks", bunch: "bunches",
  clove: "cloves", head: "heads", pint: "pints" };

// "3 garlic cloves, minced" -> {qty: 3, unit: "", name: "garlic cloves"}
function parseIng(line) {
  var s = trim(line), c = s.lastIndexOf(",");
  if (c > -1 && PREP_RE.test(s.slice(c + 1))) s = trim(s.slice(0, c));
  s = trim(s.replace(/\s*\(optional\)/i, ""));
  var m = QTY_RE.exec(s);
  if (!m) return { qty: null, unit: "", name: s };
  var q = parseAmount(m[1]);
  if (!(q > 0)) return { qty: null, unit: "", name: s };
  var rest = m[2], unit = "", u = UNIT_RE.exec(rest);
  if (u) { unit = u[1].toLowerCase(); unit = UNIT_NORM[unit] || unit; rest = u[2]; }
  return { qty: q, unit: unit, name: trim(rest) };
}

function pluralize(name) {
  var m = /^(.*?)([A-Za-z]+)([^A-Za-z]*)$/.exec(name);
  if (!m) return name;
  var w = m[2];
  if (/s$/i.test(w)) return name;
  if (/o$/i.test(w) || /(ch|sh|x)$/i.test(w)) w += "es";
  else if (/[^aeiou]y$/i.test(w)) w = w.slice(0, -1) + "ies";
  else w += "s";
  return m[1] + w + m[3];
}

function shopItems() {
  var items = {}, list = [], recipes = [], i, j;
  function add(line, src, extra) {
    var p = parseIng(line);
    if (!p.name) return;
    var key = (p.qty == null ? "t|" : p.unit + "|") + p.name.toLowerCase(), it = items[key];
    if (!it) {
      it = items[key] = { key: key, qty: p.qty, unit: p.unit, name: p.name, n: 0, single: true, sources: [], extra: null, aisle: aisleOf(p.name) };
      list.push(it);
    } else if (p.qty != null) it.qty += p.qty;
    it.n++;
    if (p.qty != null && p.qty > 1) it.single = false;
    if (src && it.sources.indexOf(src) === -1) it.sources.push(src);
    if (extra) it.extra = line;
  }
  for (i = 0; i < state.shop.recipes.length; i++) {
    var r = state.bySlug[state.shop.recipes[i]];
    if (!r) continue;
    recipes.push(r);
    for (j = 0; j < r.ingredients.length; j++) {
      var line = r.ingredients[j];
      if (/:$/.test(line) || /^#/.test(line)) continue;
      add(line, r.title, false);
    }
  }
  for (i = 0; i < state.shop.extras.length; i++) add(state.shop.extras[i], null, true);
  return { items: list, recipes: recipes };
}

function itemText(it) {
  if (it.qty == null) return it.name;
  var q = it.qty;
  var qs = Math.abs(q - Math.round(q)) < 0.02 ? String(Math.round(q)) : fmtFrac(q).replace("≈ ", "");
  var u = it.unit ? (q > 1 && UNIT_PLURAL[it.unit] ? UNIT_PLURAL[it.unit] : it.unit) + " " : "";
  var name = (!it.unit && it.n > 1 && it.single && q > 1) ? pluralize(it.name) : it.name;
  return qs + " " + u + name;
}

function groupItems(items) {
  var groups = [], i;
  for (i = 0; i < AISLES.length; i++) groups.push([]);
  for (i = 0; i < items.length; i++) groups[items[i].aisle].push(items[i]);
  return groups;
}

function renderShop() {
  $("backBtn").className = "icon-btn";
  $("backBtn").innerHTML = "&#8249; Back";
  $("sizeBtn").className = "icon-btn hidden";
  $("shopBtn").className = "icon-btn hidden";
  $("appTitle").className = "app-title serif hidden";
  $("listControls").className = "hidden";
  setStatus("", false);

  var data = shopItems(), groups = groupItems(data.items), i, j, chips = "", body = "", left = 0;
  for (i = 0; i < data.recipes.length; i++) {
    chips += '<button class="rchip" data-rm="' + esc(data.recipes[i].slug) + '">' + esc(data.recipes[i].title) +
      ' <span class="x">&times;</span></button>';
  }
  for (i = 0; i < AISLES.length; i++) {
    if (!groups[i].length) continue;
    body += '<div class="aisle"><h3>' + esc(AISLES[i]) + '</h3><ul class="ing shop">';
    for (j = 0; j < groups[i].length; j++) {
      var it = groups[i][j], done = !!state.shop.checked[it.key];
      if (!done) left++;
      body += '<li data-key="' + esc(it.key) + '" class="' + (done ? "done" : "") + '">' + esc(itemText(it)) +
        (it.sources.length ? '<span class="src">' + esc(it.sources.join(", ")) + "</span>" : "") +
        (it.extra != null ? '<button class="rmx" data-x="' + esc(it.extra) + '">&times;</button>' : "") + "</li>";
    }
    body += "</ul></div>";
  }
  var empty = !data.items.length;

  $("main").innerHTML =
    '<div class="conv shopv"><h1 class="serif">Shopping list</h1>' +
    '<div class="col"><h2 class="serif">Recipes</h2>' +
      (chips || '<p class="hint">No recipes yet. Tap <b>Select</b> on the recipe list, or <b>+ Add to shopping list</b> on a recipe.</p>') +
      (empty ? "" :
        '<div><button class="btn" id="shopShare">Share list</button>' +
        '<button class="btn alt" id="shopUncheck">Uncheck all</button>' +
        '<button class="btn alt" id="shopClear">Clear list</button></div>') +
    "</div>" +
    '<div class="col"><h2 class="serif">' + (empty ? "Items" : left + " item" + (left === 1 ? "" : "s") + " to buy") + "</h2>" +
      '<div class="frow addrow"><div class="field"><input id="shopAdd" type="text" placeholder="Add an item, e.g. milk" autocomplete="off"></div>' +
      '<button class="btn" id="shopAddBtn">Add</button></div>' +
      (empty ? "" : '<p class="hint">Tap items you already have to check them off. Share sends only the unchecked items.</p>') +
      '<div class="aisles">' + body + "</div>" +
    "</div></div>";
}

function shopText() {
  var data = shopItems(), groups = groupItems(data.items), out = "Shopping list\n", i, j, titles = [];
  for (i = 0; i < AISLES.length; i++) {
    var lines = "";
    for (j = 0; j < groups[i].length; j++) if (!state.shop.checked[groups[i][j].key]) lines += "- " + itemText(groups[i][j]) + "\n";
    if (lines) out += "\n" + AISLES[i].toUpperCase() + "\n" + lines;
  }
  for (i = 0; i < data.recipes.length; i++) titles.push(data.recipes[i].title);
  if (titles.length) out += "\nFor: " + titles.join(", ") + "\n";
  return out;
}

function copyText(text) {
  var ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly", "");
  ta.style.position = "fixed"; ta.style.top = "-1000px"; ta.style.fontSize = "16px";
  document.body.appendChild(ta);
  var range = document.createRange(); range.selectNodeContents(ta);
  var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
  ta.setSelectionRange(0, text.length);
  var ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
  return ok;
}

function shareShop() {
  var text = shopText();
  if (navigator.share) {
    navigator.share({ title: "Shopping list", text: text })["catch"](function () {});
    return;
  }
  if (copyText(text)) setStatus("Copied. Paste it into Messages, Notes, or Reminders.", false);
  else alert(text);
}

function addExtra() {
  var v = trim($("shopAdd").value);
  if (!v) return;
  state.shop.extras.push(v);
  saveShop(); renderShop();
  $("shopAdd").focus();
}

function handleShopClick(t) {
  var el;
  if (t.id === "addShop") {
    var s = currentSlug();
    if (s) {
      toggleOnList(s);
      t.className = "btn" + (onList(s) ? " alt" : "");
      t.innerHTML = onList(s) ? "✓ On shopping list" : "+ Add to shopping list";
    }
    return true;
  }
  if (t.id === "selAdd") {
    for (var i = 0; i < state.recipes.length; i++) {
      var slug = state.recipes[i].slug;
      if (state.selected[slug] && !onList(slug)) state.shop.recipes.push(slug);
    }
    saveShop();
    goTo("shop");
    return true;
  }
  if (window.location.hash !== "#shop") return false;
  if ((el = closest(t, "rmx"))) {
    var k = state.shop.extras.indexOf(el.getAttribute("data-x"));
    if (k > -1) state.shop.extras.splice(k, 1);
    saveShop(); renderShop(); return true;
  }
  if ((el = closest(t, "rchip"))) { toggleOnList(el.getAttribute("data-rm")); renderShop(); return true; }
  if (t.id === "shopShare") { shareShop(); return true; }
  if (t.id === "shopUncheck") { state.shop.checked = {}; saveShop(); renderShop(); return true; }
  if (t.id === "shopClear") {
    if (confirm("Clear the whole shopping list?")) { state.shop = { recipes: [], checked: {}, extras: [] }; saveShop(); renderShop(); }
    return true;
  }
  if (t.id === "shopAddBtn") { addExtra(); return true; }
  var li = t;
  while (li && li.tagName !== "LI") li = li.parentNode;
  if (li && li.getAttribute("data-key") != null) {
    var key = li.getAttribute("data-key");
    if (state.shop.checked[key]) delete state.shop.checked[key]; else state.shop.checked[key] = true;
    saveShop(); renderShop(); return true;
  }
  return false;
}

document.addEventListener("keydown", function (e) {
  if (e.target && e.target.id === "shopAdd" && (e.keyCode === 13 || e.key === "Enter")) { e.preventDefault(); addExtra(); }
});

function goTo(view) {
  var h = window.location.hash;
  if (h !== "#convert" && h !== "#shop") state.prevHash = h;
  state.selecting = false; state.selected = {};
  window.location.hash = view;
  window.scrollTo(0, 0);
}

/* ---------- routing ---------- */
function currentSlug() {
  var m = /^#r=(.+)$/.exec(window.location.hash);
  return m ? decodeURIComponent(m[1]) : null;
}

function route() {
  $("backBtn").innerHTML = "&#8249; All recipes";
  $("convBtn").className = "icon-btn";
  $("shopBtn").className = "icon-btn";
  $("selectBtn").className = "icon-btn hidden";
  $("selBar").className = "selbar hidden";
  $("main").className = "wrap";
  updateShopBadge();
  if (window.location.hash === "#convert") { renderConvert(); return; }
  if (window.location.hash === "#shop") { renderShop(); return; }
  if (!sheetUrl()) { renderSetup(); return; }
  var slug = currentSlug();
  if (slug && state.bySlug[slug]) { renderRecipe(state.bySlug[slug]); return; }
  renderList();
}

function applyTextSize() {
  document.body.className = document.body.className.replace(/\bts-\d\b/g, "") + " ts-" + state.textSize;
}

/* ---------- events ---------- */
function closest(el, cls) {
  while (el && el !== document) {
    if (el.className && (" " + el.className + " ").indexOf(" " + cls + " ") > -1) return el;
    el = el.parentNode;
  }
  return null;
}

document.addEventListener("click", function (e) {
  var t = e.target, el;

  if ((el = closest(t, "chip"))) { state.category = el.getAttribute("data-cat"); renderList(); return; }
  if (handleShopClick(t)) return;
  if ((el = closest(t, "card"))) {
    var cs = el.getAttribute("data-slug");
    if (state.selecting) {
      state.selected[cs] = !state.selected[cs];
      el.className = "card" + (state.selected[cs] ? " sel" : "");
      updateSelBar(); return;
    }
    window.location.hash = "r=" + encodeURIComponent(cs);
    window.scrollTo(0, 0); return;
  }

  var slug = currentSlug();
  if (slug && state.bySlug[slug]) {
    var r = state.bySlug[slug], li = t;
    while (li && li.tagName !== "LI") li = li.parentNode;
    if (li && li.getAttribute("data-i") != null) {
      var i = parseInt(li.getAttribute("data-i"), 10);
      if (closest(li, "ing")) {
        var c = state.checked[slug] || (state.checked[slug] = {});
        c[i] = !c[i];
        li.className = c[i] ? "done" : "";
        return;
      }
      if (closest(li, "steps")) {
        state.stepCur[slug] = state.stepCur[slug] === i ? null : i;
        $("stepCol").innerHTML = '<h2 class="serif">Steps</h2><p class="hint">Tap a step to mark your place</p>' + renderSteps(r);
        return;
      }
    }
  }

  if (t.id === "saveUrl") {
    var v = ($("urlInput").value || "").replace(/^\s+|\s+$/g, "");
    if (!/^https?:\/\//.test(v)) { alert("That doesn't look like a link. Paste the full https:// address."); return; }
    store.set("sheetUrl", v); refresh(); return;
  }
  if (t.id === "useDemo") { store.set("sheetUrl", "demo"); refresh(); return; }
});

$("backBtn").addEventListener("click", function () {
  var h = window.location.hash;
  var target = (h === "#convert" || h === "#shop") ? state.prevHash : "";
  if (h !== target) window.location.hash = target;
  route(); window.scrollTo(0, 0);
});
$("convBtn").addEventListener("click", function () { goTo("convert"); });
$("shopBtn").addEventListener("click", function () { goTo("shop"); });
$("selectBtn").addEventListener("click", function () {
  state.selecting = !state.selecting;
  state.selected = {};
  renderList();
});
$("refreshBtn").addEventListener("click", function () { refresh(); });
$("sizeBtn").addEventListener("click", function () {
  state.textSize = state.textSize >= 3 ? 1 : state.textSize + 1;
  store.set("textSize", String(state.textSize));
  applyTextSize();
});
$("search").addEventListener("input", function () { state.query = this.value; renderList(); });
// Long-press the title to disconnect / change the sheet link
var pressTimer = null;
$("appTitle").addEventListener("touchstart", function () {
  pressTimer = setTimeout(function () {
    if (confirm("Change the recipe sheet link on this device?")) { store.del("sheetUrl"); store.del("cachedCSV"); route(); }
  }, 1500);
});
$("appTitle").addEventListener("touchend", function () { clearTimeout(pressTimer); });
window.addEventListener("hashchange", route);
// Refresh when the app comes back to the foreground (if older than 10 min)
document.addEventListener("visibilitychange", function () {
  if (!document.hidden && state.lastUpdated && Date.now() - state.lastUpdated.getTime() > 600000) refresh();
});

/* ---------- start ---------- */
$("appTitle").textContent = APP_TITLE;
document.title = APP_TITLE;
applyTextSize();
(function boot() {
  var cached = store.get("cachedCSV");
  if (cached && sheetUrl() && sheetUrl() !== "demo") {
    try {
      loadFromCSV(cached);
      state.lastUpdated = new Date(parseInt(store.get("cachedAt") || "0", 10));
      route();
    } catch (e) {}
  }
  refresh();
})();
</script>
</body>
</html>
